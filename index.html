<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Room - Liquid Glass Command Center</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Liquid Glass Background -->
    <div class="liquid-bg">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>
        <div class="bg-blob blob-4"></div>
        <div class="bg-blob blob-5"></div>
    </div>

    <!-- Glass Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar px-3">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="#">
                <i class="fa-solid fa-seedling me-2"></i>Smart Room
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white active-nav" href="#" onclick="switchPage('page1', this)">Monitoring Utama</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#" onclick="switchPage('page2', this)">Analisis & Mode</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Container Utama -->
    <div class="container min-vh-100 d-flex justify-content-center align-items-center position-relative pt-5 pb-5" style="z-index: 10;">
        
        <!-- ================= PAGE 1: MONITORING & KENDALI ================= -->
        <div id="page1" class="glass-card p-4 p-md-5 text-center text-white w-100 page-section fade-in mt-4">
            <h3 class="fw-bold mb-4"><i class="fa-solid fa-satellite-dish me-2"></i>Data Real-time</h3>
            
            <div class="row g-4 justify-content-center">
                <!-- Kotak Suhu -->
                <div class="col-12 col-md-5">
                    <div class="data-item p-4">
                        <i class="fa-solid fa-temperature-half fa-2x mb-3 text-warning"></i>
                        <p class="mb-1 fw-light text-uppercase tracking-wide">Suhu</p>
                        <h1 class="fw-bold mb-0 display-5" id="tempValue">--<span class="fs-4">°C</span></h1>
                    </div>
                </div>
                <!-- Kotak Kelembapan -->
                <div class="col-12 col-md-5">
                    <div class="data-item p-4">
                        <i class="fa-solid fa-droplet fa-2x mb-3 text-info"></i>
                        <p class="mb-1 fw-light text-uppercase tracking-wide">Kelembapan</p>
                        <h1 class="fw-bold mb-0 display-5" id="humValue">--<span class="fs-4">%</span></h1>
                    </div>
                </div>
            </div>

            <!-- Panel Kendali (Tindakan Cepat) -->
            <div class="mt-4 pt-4 border-top border-light border-opacity-25">
                <h6 class="fw-light text-uppercase tracking-wide mb-4 text-white-50">Panel Kendali Aktuator</h6>
                <div class="d-flex justify-content-center gap-4 flex-wrap">
                    <div class="control-switch" onclick="toggleDevice('fan', this)">
                        <i class="fa-solid fa-fan mb-2 fs-4"></i>
                        <span class="d-block text-uppercase small">Kipas</span>
                    </div>
                    <div class="control-switch" onclick="toggleDevice('ac', this)">
                        <i class="fa-regular fa-snowflake mb-2 fs-4"></i>
                        <span class="d-block text-uppercase small">Pendingin</span>
                    </div>
                    <div class="control-switch" onclick="toggleDevice('humidifier', this)">
                        <i class="fa-solid fa-spray-can-sparkles mb-2 fs-4"></i>
                        <span class="d-block text-uppercase small">Pelembap</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= PAGE 2: MODE & ANALISIS TREN ================= -->
        <div id="page2" class="glass-card p-4 p-md-5 text-center text-white w-100 page-section d-none fade-in mt-4">
            
            <!-- Mode Lingkungan -->
            <div class="mb-4 pb-4 border-bottom border-light border-opacity-25">
                <h4 class="fw-bold mb-4"><i class="fa-solid fa-sliders me-2"></i>Mode Target Ruangan</h4>
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button class="btn glass-btn active-mode" onclick="setMode('normal', this)">
                        <i class="fa-solid fa-house me-2"></i>Normal
                    </button>
                    <button class="btn glass-btn" onclick="setMode('sleep', this)">
                        <i class="fa-solid fa-moon me-2"></i>Tidur
                    </button>
                    <button class="btn glass-btn" onclick="setMode('workout', this)">
                        <i class="fa-solid fa-dumbbell me-2"></i>Olahraga
                    </button>
                </div>
                <p id="modeFeedback" class="mt-3 mb-0 text-white-50 small fw-light">Mode Normal aktif: Mempertahankan sirkulasi standar.</p>
            </div>

            <!-- Grafik Tren -->
            <div>
                <h4 class="fw-bold mb-3"><i class="fa-solid fa-chart-line me-2"></i>Tren Fluktuasi Udara</h4>
                <div class="chart-wrapper" style="position: relative; height:35vh; width:100%">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

        </div>

    </div>

    <!-- Scripts Bootstrap & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
